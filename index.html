<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Northstar Market</title>
  <style>
    :root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; color: #172033; background: #f5f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { background: #15284b; color: white; padding: 1rem max(1rem, calc((100% - 1040px)/2)); display:flex; align-items:center; justify-content:space-between; }
    header h1 { font-size: 1.25rem; margin: 0; }
    main { max-width: 1040px; margin: 2rem auto; padding: 0 1rem; }
    button { border:0; border-radius:8px; background:#2457c5; color:white; padding:.65rem .9rem; font:inherit; cursor:pointer; }
    button:hover { background:#19449f; }
    button.secondary { background:#e7ecf5; color:#172033; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1rem; }
    .card, section { background:white; border:1px solid #e2e7f0; border-radius:12px; padding:1rem; }
    .emoji { font-size:3rem; background:#eef2fa; border-radius:9px; text-align:center; padding:.6rem; }
    .card h3 { margin:.6rem 0 0; }
    .price { font-weight:700; }
    .layout { display:grid; grid-template-columns:1.2fr .8fr; gap:1rem; }
    label { display:block; margin:.7rem 0 .25rem; font-weight:600; }
    input { width:100%; border:1px solid #bbc5d6; border-radius:7px; padding:.65rem; font:inherit; }
    .item { display:flex; align-items:center; gap:.6rem; padding:.6rem 0; border-bottom:1px solid #e8ebf1; }
    .item-name { flex:1; }
    .item input { width:4.5rem; }
    .muted { color:#5a6578; }
    .notice { padding:.8rem; background:#edf7ef; border-radius:8px; }
    [hidden] { display:none !important; }
    @media(max-width:700px) { .layout { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header><h1>Northstar Market</h1><button id="cart-link" class="secondary" aria-label="View cart">Cart <span id="cart-count">0</span></button></header>
  <main>
    <section id="catalog-view">
      <h2>Everyday essentials</h2><p class="muted">A sample shop for practicing a complete cart and checkout flow.</p>
      <div class="grid" id="products"></div>
    </section>
    <section id="checkout-view" hidden>
      <h2>Your cart and checkout</h2>
      <div class="layout">
        <div><div id="cart-items"></div><p id="empty-cart" class="muted" hidden>Your cart is empty.</p>
          <p>Total: <strong id="cart-total">$0.00</strong></p>
          <button id="continue-shopping" class="secondary">Continue shopping</button>
        </div>
        <form id="checkout-form">
          <h3>Delivery details</h3>
          <label for="name">Full name</label><input id="name" name="name" autocomplete="name" required>
          <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required>
          <label for="address">Delivery address</label><input id="address" name="address" autocomplete="street-address" required>
          <button id="place-order" type="submit">Place order</button>
        </form>
      </div>
    </section>
    <section id="confirmation-view" hidden aria-live="polite">
      <h2>Order confirmed</h2><p id="confirmation-message" class="notice"></p><p id="confirmation-total"></p>
      <button id="shop-again">Shop again</button>
    </section>
  </main>
  <script>
    const products = [
      { id: 'mug', name: 'Ceramic Mug', price: 12.50, icon: '☕' },
      { id: 'tote', name: 'Canvas Tote', price: 18.00, icon: '👜' },
      { id: 'notebook', name: 'Pocket Notebook', price: 7.25, icon: '📓' }
    ];
    const $ = (id) => document.getElementById(id);
    const money = (amount) => `$${amount.toFixed(2)}`;
    const readCart = () => JSON.parse(localStorage.getItem('northstar-cart') || '{}');
    const writeCart = (cart) => { localStorage.setItem('northstar-cart', JSON.stringify(cart)); renderCart(); };
    function show(view) { ['catalog-view','checkout-view','confirmation-view'].forEach(id => $(id).hidden = id !== view); }
    function renderProducts() {
      $('products').innerHTML = products.map(p => `<article class="card"><div class="emoji" aria-hidden="true">${p.icon}</div><h3>${p.name}</h3><p class="price">${money(p.price)}</p><button data-add="${p.id}" aria-label="Add ${p.name} to cart">Add to cart</button></article>`).join('');
      document.querySelectorAll('[data-add]').forEach(button => button.addEventListener('click', () => { const cart=readCart(); const id=button.dataset.add; cart[id]=(cart[id]||0)+1; writeCart(cart); button.textContent='Added'; setTimeout(()=>button.textContent='Add to cart',700); }));
    }
    function renderCart() {
      const cart=readCart(); const entries=products.filter(p => cart[p.id] > 0);
      $('cart-count').textContent=entries.reduce((sum,p)=>sum+cart[p.id],0);
      $('cart-items').innerHTML=entries.map(p=>`<div class="item"><span class="item-name">${p.name} (${money(p.price)})</span><label for="qty-${p.id}" class="muted">Qty</label><input id="qty-${p.id}" aria-label="${p.name} quantity" type="number" min="0" max="99" value="${cart[p.id]}" data-qty="${p.id}"><button class="secondary" data-remove="${p.id}" aria-label="Remove ${p.name}">Remove</button></div>`).join('');
      $('empty-cart').hidden=entries.length>0;
      $('cart-total').textContent=money(entries.reduce((sum,p)=>sum+p.price*cart[p.id],0));
      document.querySelectorAll('[data-qty]').forEach(input=>input.addEventListener('change',()=>{const next=readCart(); const quantity=Math.max(0,Math.min(99,Number(input.value)||0)); if(quantity) next[input.dataset.qty]=quantity; else delete next[input.dataset.qty]; writeCart(next);}));
      document.querySelectorAll('[data-remove]').forEach(button=>button.addEventListener('click',()=>{const next=readCart(); delete next[button.dataset.remove]; writeCart(next);}));
      $('place-order').disabled=entries.length===0;
    }
    $('cart-link').addEventListener('click',()=>{show('checkout-view');renderCart();});
    $('continue-shopping').addEventListener('click',()=>show('catalog-view'));
    $('checkout-form').addEventListener('submit',event=>{
      event.preventDefault(); if(!$('checkout-form').reportValidity()) return;
      const cart=readCart(); const total=products.reduce((sum,p)=>sum+p.price*(cart[p.id]||0),0);
      if(total<=0) return;
      const orderId=`NS-${Date.now().toString().slice(-6)}`;
      $('confirmation-message').textContent=`Thanks, ${$('name').value.trim()}! Your order ${orderId} is confirmed. A receipt will be sent to ${$('email').value.trim()}.`;
      $('confirmation-total').textContent=`Order total: ${money(total)}`;
      localStorage.removeItem('northstar-cart'); $('checkout-form').reset(); renderCart(); show('confirmation-view');
    });
    $('shop-again').addEventListener('click',()=>{renderCart();show('catalog-view');});
    renderProducts(); renderCart();
  </script>
</body>
</html>
